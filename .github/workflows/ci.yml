name: CI / Automated Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type checking
        run: npm run typecheck

      - name: Execute automated unit test suite
        run: npm test

      - name: Next.js production build verification
        run: npm run build
        env:
          NODE_ENV: production
          JWT_SECRET: ci_synthetic_test_secret_32_bytes_long_key
